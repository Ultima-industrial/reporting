# Import VAT ("IVA in entrata") self-accounting rules — Ultima pays this
# VAT directly to customs (not the supplier) for confirmed, not-yet-arrived
# purchase orders from suppliers based in a listed country, some days
# before the order's expected arrival (Odoo's "date_planned" field,
# labeled "Arrivo Previsto" in the Italian UI), separate from and in
# addition to any payment owed to the supplier itself on their own bill.
# It's recovered as input VAT at Ultima's next quarterly IVA settlement
# after the payment date (Ultima files quarterly, "trimestrale per
# opzione") — see exec_data._vat_settlement_date.
#
# Rewritten 2026-09-10 per Annalisa Casavecchia: generalized from a
# per-supplier name list (previously just "Alphabond") to a country-based
# rule covering all UK-based suppliers, with an explicit exclude list for
# suppliers based there on paper but out of scope in practice — e.g.
# Biodtex Technologies Ltd (formerly listed here as "Bioscan" — corrected
# 2026-09) is UK-registered but ships from France, so ordinary EU
# intra-community VAT rules apply instead of import VAT at customs.
#
# countries: ISO country codes matched against the purchase order vendor's
# country (e.g. "GB" = United Kingdom).
# exclude: supplier names (case-insensitive substring) exempted even
# though they're based in a listed country.
# vat_percent: percentage of the PO's amount_total.
# days_before_arrival: how many days before date_planned the payment is due.

- countries: ["GB"]
  exclude: ["Biodtex Technologies"]
  vat_percent: 22
  days_before_arrival: 5
