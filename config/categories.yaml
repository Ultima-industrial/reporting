# Keyword rules for auto-categorization. Matching is case-insensitive substring
# match against the transaction description + counterparty name. First category
# whose keyword list matches wins; order matters for overlaps (e.g. "tax" before
# "goods"). Anything matching nothing falls back to "Other".
#
# Edit freely — these are starting-point guesses, not final rules. Recurring
# counterparties that don't fit a keyword pattern should go in
# counterparty_map.yaml instead, which always takes priority over these rules.

